name: Pages

# Build the inspector and publish it to GitHub Pages. The site is a project site
# served from /lumenscan-web/, so BASE_PATH is set to match; vite's `base` reads
# it (see vite.config.ts). Pages must have "GitHub Actions" selected as its
# source once, under Settings → Pages.
on:
  push:
    branches: [main]
  # Allow a manual redeploy from the Actions tab without an unrelated push.
  workflow_dispatch:

# The deploy job needs these to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a running deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        # The project site lives at https://<org>.github.io/lumenscan-web/, so
        # assets must be requested from /lumenscan-web/ rather than the domain root.
        run: npm run build
        env:
          BASE_PATH: /lumenscan-web/

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
